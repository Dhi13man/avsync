name: Bug report
description: Report a reproducible problem.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug. Do not upload private media."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact actions that trigger the bug.
      placeholder: |
        1. Open the app
        2. Load ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 126, Firefox 127, Safari 18"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "node --version"
  - type: textarea
    id: media
    attributes:
      label: Media details
      description: Describe codecs, duration, size, and source. Do not attach private files.
  - type: textarea
    id: logs
    attributes:
      label: Console or FFmpeg log
      render: text
